[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-posture-dashboard"
version = "0.1.0"
description = "A local-first dashboard for understanding synthetic cloud security findings."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "Flask==3.1.3",
  "Flask-WTF==1.3.0",
  "jsonschema[format-nongpl]==4.26.0",
  "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3", "mypy==2.4.1",
  "types-jsonschema==4.26.0.20261006",
]

[tool.setuptools.packages.find]
include = ["posture*"]

[tool.setuptools.package-data]
posture = ["templates/*.html", "static/*", "schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=posture --cov-branch --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["posture"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["posture"]

[[tool.mypy.overrides]]
module = ["flask_wtf", "flask_wtf.csrf"]
ignore_missing_imports = true
